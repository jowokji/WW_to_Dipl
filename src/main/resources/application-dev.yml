spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/weatherwear
    username: ${PGUSER:weatherwear_app}
    password: ${PGPASSWORD:${APP_DB_PASSWORD:}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

weather:
  api:
    key: ${WEATHER_API_KEY:}
    url: "https://api.openweathermap.org/data/2.5/weather"

llm:
  api:
    key: ${LLM_API_KEY:}
    model: ${LLM_MODEL:gpt-5}
    max-completion-tokens: ${LLM_MAX_COMPLETION_TOKENS:500}
    reasoning-effort: ${LLM_REASONING_EFFORT:minimal}
    url: "https://api.openai.com/v1/chat/completions"
