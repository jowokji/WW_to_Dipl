spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/weatherwear
    username: weatherwear_user
    password: weatherwear_password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

jwt:
  secret: "this-is-a-very-long-secret-key-for-weatherwear-jwt-authentication"
  expiration: 86400000

weather:
  api:
    key: ""
    url: "https://api.openweathermap.org/data/2.5/weather"

llm:
  api:
    key: ""
    url: "https://api.openai.com/v1/chat/completions"
