name: CI/CD

on:
  push:
    branches:
      - main
      - master
      - develop
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-checks:
    name: Code checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Format check
        run: mvn -B spotless:check

      - name: Lint
        run: mvn -B checkstyle:check

  security:
    name: Static security analysis
    runs-on: ubuntu-latest
    needs: code-checks
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          queries: security-extended

      - name: Build for CodeQL
        run: mvn -B -DskipTests package

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  build:
    name: Build
    runs-on: ubuntu-latest
    needs:
      - code-checks
      - security

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build
        run: mvn -B clean compile

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: build
    environment: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Test
        run: mvn -B test

      - name: Upload JaCoCo report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  package:
    name: Package artifacts
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Package
        run: mvn -B package -DskipTests

      - name: Build Docker image artifact
        run: |
          docker build -t weatherwear-backend:${{ github.sha }} .
          docker save weatherwear-backend:${{ github.sha }} -o target/weatherwear-backend-image.tar

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: weatherwear-backend
          path: |
            target/*.jar
            target/weatherwear-backend-image.tar

  deploy-production:
    name: Deploy to Railway
    runs-on: ubuntu-latest
    needs: package
    if: github.event_name == 'workflow_dispatch'
    environment: production

    steps:
      - name: Trigger Railway deployment
        env:
          RAILWAY_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RAILWAY_DEPLOY_HOOK_URL" ]; then
            echo "RAILWAY_DEPLOY_HOOK_URL secret is not configured."
            exit 1
          fi

          curl -fsSL -X POST "$RAILWAY_DEPLOY_HOOK_URL"
