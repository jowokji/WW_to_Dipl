services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: weatherwear
      POSTGRES_USER: weatherwear_db_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      APP_DB_USER: ${APP_DB_USER:-weatherwear_app}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - weatherwear_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro

  backend:
    build: .
    restart: always
    depends_on:
      - postgres
    ports:
      - "${APP_PORT:-8090}:8090"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8090

      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: weatherwear
      PGUSER: ${APP_DB_USER:-weatherwear_app}
      PGPASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: 86400000

      WEATHER_API_KEY: ${WEATHER_API_KEY:?WEATHER_API_KEY is required}
      WEATHER_API_URL: https://api.openweathermap.org/data/2.5/weather

      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_MODEL: ${LLM_MODEL:-gpt-5}
      LLM_MAX_COMPLETION_TOKENS: ${LLM_MAX_COMPLETION_TOKENS:-800}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-minimal}
      LLM_API_URL: https://api.openai.com/v1/chat/completions

      OPENAPI_SERVER_URL: ${OPENAPI_SERVER_URL:-http://localhost:8090/api}

volumes:
  weatherwear_postgres_data:
