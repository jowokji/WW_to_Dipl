server:
  address: 0.0.0.0
  port: ${PORT:8090}
  servlet:
    context-path: /api

spring:
  application:
    name: weatherwear-backend

  datasource:
    url: jdbc:postgresql://localhost:5433/weatherwear
    username: weatherwear_user
    password: ${PGPASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

jwt:
  secret: ${JWT_SECRET:}
  expiration: 86400000

weather:
  api:
    key: ${WEATHER_API_KEY:}
    url: https://api.openweathermap.org/data/2.5/weather

llm:
  api:
    key: ${LLM_API_KEY:}
    url: https://api.openai.com/v1/chat/completions
