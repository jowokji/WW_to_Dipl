spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

weather:
  api:
    key: ${WEATHER_API_KEY}
    url: ${WEATHER_API_URL:https://api.openweathermap.org/data/2.5/weather}

llm:
  api:
    key: ${LLM_API_KEY}
    url: ${LLM_API_URL:https://api.openai.com/v1/chat/completions}