services:
  postgres:
    image: postgres:16
    container_name: weatherwear-postgres
    restart: always
    environment:
      POSTGRES_DB: weatherwear
      POSTGRES_USER: weatherwear_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "5433:5432"
    volumes:
      - weatherwear_postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: weatherwear-backend
    restart: always
    depends_on:
      - postgres
    ports:
      - "8090:8090"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8090

      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: weatherwear
      PGUSER: weatherwear_user
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: 86400000

      WEATHER_API_KEY: ${WEATHER_API_KEY:?WEATHER_API_KEY is required}
      WEATHER_API_URL: https://api.openweathermap.org/data/2.5/weather

      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_API_URL: https://api.openai.com/v1/chat/completions

volumes:
  weatherwear_postgres_data:
