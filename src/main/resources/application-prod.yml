spring:
  datasource:
    url: jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
    username: ${PGUSER}
    password: ${PGPASSWORD:${APP_DB_PASSWORD}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

weather:
  api:
    key: ${WEATHER_API_KEY}
    url: ${WEATHER_API_URL:https://api.openweathermap.org/data/2.5/weather}

llm:
  api:
    key: ${LLM_API_KEY}
    model: ${LLM_MODEL:gpt-5}
    max-completion-tokens: ${LLM_MAX_COMPLETION_TOKENS:500}
    reasoning-effort: ${LLM_REASONING_EFFORT:minimal}
    url: ${LLM_API_URL:https://api.openai.com/v1/chat/completions}

openapi:
  server-url: ${OPENAPI_SERVER_URL:https://wwtodipl-production.up.railway.app/api}
