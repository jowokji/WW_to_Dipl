version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: weatherwear-postgres
    restart: always
    environment:
      POSTGRES_DB: weatherwear
      POSTGRES_USER: weatherwear_user
      POSTGRES_PASSWORD: weatherwear_password
    ports:
      - "5432:5432"
    volumes:
      - weatherwear_postgres_data:/var/lib/postgresql/data

  backend:
    build: .
    container_name: weatherwear-backend
    restart: always
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod

      DATABASE_URL: jdbc:postgresql://postgres:5432/weatherwear
      DATABASE_USERNAME: weatherwear_user
      DATABASE_PASSWORD: weatherwear_password

      JWT_SECRET: this-is-a-very-long-secret-key-for-weatherwear-jwt-authentication
      JWT_EXPIRATION: 86400000

      WEATHER_API_KEY: your_openweather_api_key
      WEATHER_API_URL: https://api.openweathermap.org/data/2.5/weather

      LLM_API_KEY: your_llm_api_key
      LLM_API_URL: https://api.openai.com/v1/chat/completions

volumes:
  weatherwear_postgres_data: